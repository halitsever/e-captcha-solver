version: 2
updates:
  - package-ecosystem: npm
    directory: /node
    schedule:
      interval: monthly
    # Gives the registry a week to pull compromised releases before they reach a PR.
    cooldown:
      default-days: 7
    groups:
      npm-node-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
      npm-node-major:
        patterns: ["*"]
        update-types: [major]

  - package-ecosystem: npm
    directory: /docs
    schedule:
      interval: monthly
    # Gives the registry a week to pull compromised releases before they reach a PR.
    cooldown:
      default-days: 7
    groups:
      npm-docs-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
      npm-docs-major:
        patterns: ["*"]
        update-types: [major]

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    # The >= floors only set what users may install, so leave them unless a release falls outside.
    versioning-strategy: increase-if-necessary
    # Gives the registry a week to pull compromised releases before they reach a PR.
    cooldown:
      default-days: 7
    groups:
      pip-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
      pip-major:
        patterns: ["*"]
        update-types: [major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # Gives the registry a week to pull compromised releases before they reach a PR.
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
